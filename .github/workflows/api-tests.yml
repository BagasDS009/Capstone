name: API Tests

on:
  push:
    branches: [master, main]
    paths:
      - 'AutomationApiTesting/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'AutomationApiTesting/**'
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AutomationApiTesting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run API tests
        run: mvn clean verify
        continue-on-error: true

      - name: Generate Serenity report
        if: always()
        run: mvn serenity:aggregate

      - name: Upload Serenity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: AutomationApiTesting/target/site/serenity/
          retention-days: 14
