name: Mobile Tests

on:
  push:
    branches: [refactor]
    paths:
      - 'AutomationMobileTesing/**'
  pull_request:
    branches: [refactor]
    paths:
      - 'AutomationMobileTesing/**'
  workflow_dispatch:

jobs:
  mobile-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AutomationMobileTesing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Enable KVM (for Android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: Start Appium server
        run: appium --relaxed-security &
        
      - name: Create and start Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            cd ${{ github.workspace }}/AutomationMobileTesing
            mvn clean verify
        
      - name: Generate Serenity report
        if: always()
        run: mvn serenity:aggregate

      - name: Upload Serenity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-report
          path: AutomationMobileTesing/target/site/serenity/
          retention-days: 14
